# Builds the 1080p / 2K / 4K packages on every push, and attaches them to a
# GitHub Release when you push a version tag (e.g. `git tag v1.0.0 && git push --tags`).
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and package
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { "dev-$($env:GITHUB_SHA.Substring(0,7))" }
          powershell -NoProfile -ExecutionPolicy Bypass -File host/package.ps1 -Version $version

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: shanshui-infinite-packages
          path: release/*.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.zip
          generate_release_notes: true
