<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paperwall</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #f0e9d8; }
  canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; opacity: 0; transition: opacity .9s cubic-bezier(0.23, 1, 0.32, 1); } /* strong ease-out: quick to appear, gentle to settle */
  canvas.on { opacity: 1; }
  #help { position: fixed; left: 16px; bottom: 16px; font: 12px/1.6 system-ui, sans-serif; color: #3a352e; z-index: 2;
          background: rgba(240,233,216,.88); border: 1px solid rgba(0,0,0,.12); border-radius: 6px; padding: 10px 14px;
          transition: opacity .6s; pointer-events: none; }
  #help kbd { font: 11px monospace; background: rgba(0,0,0,.07); border-radius: 3px; padding: 0 4px; }
  #help.hide { opacity: 0; }
</style>
</head>
<body>
<div id="help" class="hide"></div>
<script src="config.js"></script>
<script src="core.js"></script>
<script src="themes/shanshui.js"></script>
<script src="themes/yugen.js"></script>
<script src="themes/jiangnan.js"></script>
<script src="themes/tabiji.js"></script>
<script src="themes/sprawl.js"></script>
<script src="stage.js"></script>
<script>
(function () {
  'use strict';
  const q = new URLSearchParams(location.search);
  const opts = {};
  for (const k of Object.keys(Paperwall.DEFAULTS).concat(['theme'])) if (q.has(k)) opts[k] = q.get(k);
  const native = !!(window.chrome && chrome.webview);
  const stage = new Paperwall.Stage(document.body, opts, { fade: !q.has('nofade') });
  window.paperwall = stage;
  Object.defineProperty(window, 'shanshui', { get: () => stage.eng }); // old console handle

  // Pause on its own when the window loses focus (browser preview). The wallpaper is never
  // focused, so there the Windows host decides when it may run.
  if (!native) stage.autoPause(1500);

  // ---- Native host (WebView2): {type:'pause', value:bool} | {type:'set', key, value} | {type:'config', value:{...}}
  if (native) {
    chrome.webview.addEventListener('message', (e) => {
      const m = e.data;
      if (!m || typeof m !== 'object') return;
      if (m.type === 'pause') stage.pause(!!m.value);
      else if (m.type === 'set') stage.set(m.key, m.value);
      else if (m.type === 'config') stage.config(m.value);
    });
    chrome.webview.postMessage({ type: 'ready', themes: Paperwall.manifest() });
  }

  // ---- Lively Wallpaper (LivelyProperties.json). "look" is one list of every theme + style.
  const LISTS = {
    time: ['auto', 'dawn', 'day', 'dusk', 'night', 'cycle'],
    season: ['auto', 'spring', 'summer', 'autumn', 'winter'],
    weather: ['auto', 'none', 'rain', 'snow', 'petals'],
    quality: ['auto', 'low', '1080p', '1440p', '4k', 'native'],
  };
  const LOOKS = [];
  for (const t of Paperwall.themes) for (const s of t.styles) LOOKS.push([t.id, s.id]);
  window.livelyPropertyListener = function (name, val) {
    if (name === 'newScene') { stage.set('seed', (Math.random() * 1e9) | 0); return; }
    if (name === 'look') { const l = LOOKS[val] || LOOKS[0]; stage.config({ theme: l[0], style: l[1] }); return; }
    if (LISTS[name]) val = LISTS[name][val] || LISTS[name][0];
    stage.set(name, val);
  };
  window.livelyWallpaperPlaybackChanged = function (data) {
    try { stage.pause(JSON.parse(data).IsPaused); } catch (e) {}
  };

  // ---- Wallpaper Engine (project.json)
  window.wallpaperPropertyListener = {
    applyUserProperties(p) {
      for (const k in p) {
        const v = p[k].value;
        if (k === 'newscene') { if (v) stage.set('seed', (Math.random() * 1e9) | 0); continue; }
        if (k === 'look') { const l = String(v).split('.'); stage.config({ theme: l[0], style: l[1] }); continue; }
        stage.set(k, v);
      }
    },
    setPaused(p) { stage.pause(p); },
  };

  // ---- Browser preview controls
  const help = document.getElementById('help');
  help.innerHTML = '<kbd>Space</kbd> pause &nbsp; <kbd>N</kbd> new scene &nbsp; <kbd>V</kbd> theme &nbsp; <kbd>J</kbd> style &nbsp; <kbd>+</kbd>/<kbd>-</kbd> speed &nbsp; <kbd>T</kbd> time &nbsp; <kbd>S</kbd> season &nbsp; <kbd>W</kbd> weather &nbsp; <kbd>Q</kbd> quality &nbsp; <kbd>H</kbd> stats';
  if (q.get('preview') === '1') { help.classList.remove('hide'); setTimeout(() => help.classList.add('hide'), 7000); }
  const cycleList = (key, l) => { const i = l.indexOf(stage.get(key)); stage.set(key, l[(i + 1) % l.length]); toast(key + ': ' + stage.get(key)); };
  function toast(t) { help.textContent = t; help.classList.remove('hide'); clearTimeout(toast.t); toast.t = setTimeout(() => help.classList.add('hide'), 1600); }
  addEventListener('keydown', (e) => {
    const k = e.key.toLowerCase(), th = stage.theme;
    if (k === ' ') { stage.pause(!stage.userPaused); toast(stage.userPaused ? 'paused' : 'playing'); }
    else if (k === 'n') { stage.set('seed', (Math.random() * 1e9) | 0); toast('seed ' + stage.get('seed')); }
    else if (k === '+' || k === '=') { stage.set('speed', Math.min(8, stage.get('speed') * 1.5)); toast('speed ' + stage.get('speed').toFixed(2)); }
    else if (k === '-') { stage.set('speed', Math.max(0.1, stage.get('speed') / 1.5)); toast('speed ' + stage.get('speed').toFixed(2)); }
    else if (k === 'v') { const l = Paperwall.themes.map((t) => t.id); stage.set('theme', l[(l.indexOf(th.id) + 1) % l.length]); toast(stage.theme.name + ' / ' + stage.get('style')); }
    else if (k === 'j') cycleList('style', th.styles.map((s) => s.id));
    else if (k === 't') cycleList('time', LISTS.time);
    else if (k === 's') cycleList('season', LISTS.season);
    else if (k === 'w') cycleList('weather', th.weathers.map((w) => w.id));
    else if (k === 'q') cycleList('quality', LISTS.quality);
    else if (k === 'h') stage.set('hud', !stage.get('hud'));
  });
})();
</script>
</body>
</html>
